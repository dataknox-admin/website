# Root-level config — Cloudflare Workers Builds runs from repo root.
# Assets are served from the repo root so all sub-directories are bundled.
# Sub-routes: www.dataknox.io/third-party-maintenance/* and /buyers-guide/*
name = "website"
compatibility_date = "2026-04-29"
main = "_worker.js"

[[routes]]
pattern = "www.dataknox.io/third-party-maintenance/*"
zone_name = "dataknox.io"

[[routes]]
pattern = "www.dataknox.io/buyers-guide"
zone_name = "dataknox.io"

[[routes]]
pattern = "www.dataknox.io/buyers-guide/*"
zone_name = "dataknox.io"

[assets]
directory = "."
not_found_handling = "none"
binding = "ASSETS"
